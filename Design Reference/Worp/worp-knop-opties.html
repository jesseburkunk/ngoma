<h1>Worp: zeven NEW-knoppen in richting B</h1><p class="i">Allemaal op de echte pagina, in de houten lijst met koper. De dunne lichte ring om de knop is de golfvorm van wat je hoort (die beweegt tijdens het spelen); die staat nu op 60% zodat hij minder schreeuwt.</p>
